<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Maryam's Birthday · Moonlit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mrs+Saint+Delafield&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap">

<style>
/* Layout: a moonlit night sky; the invitation sits inside a slender silver arch, like a window onto the evening */
:root {
  --night:   #3a0c17;
  --night-2: #5a1424;
  --pearl:   #f6ece4;
  --silver:  #d9cfcf;
  --dim:     #c29a9f;
  --rose:    #f0c9c4;
  --hair:    rgba(240, 214, 210, 0.28);

  --script:  'Mrs Saint Delafield', 'Snell Roundhand', cursive;
  --display: 'Bodoni Moda', 'Didot', 'Bodoni 72', serif;
  --serif:   'Cormorant Garamond', 'Garamond', Georgia, serif;

  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; }
html, body { min-height: 100%; overflow-x: hidden; }

body {
  background:
    radial-gradient(75% 50% at 50% 6%, rgba(196, 92, 108, 0.30), transparent 70%),
    radial-gradient(60% 40% at 15% 70%, rgba(120, 30, 50, 0.35), transparent 70%),
    radial-gradient(90% 60% at 50% 120%, rgba(20, 2, 8, 0.55), transparent 70%),
    linear-gradient(180deg, var(--night-2) 0%, #4a1020 40%, var(--night) 75%, #2a0810 100%);
  background-attachment: fixed;
  color: var(--pearl);
  font-family: var(--serif);
  -webkit-font-smoothing: antialiased;
}

#sky {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* ─── Opening: mist + moon ───────────────────────────────────────── */
#mist-wrap {
  position: fixed;
  inset: 0;
  z-index: 50;
  pointer-events: none;
  transition: opacity 3s ease 0.3s, filter 3s ease;
}
#mist-wrap.lift { opacity: 0; filter: blur(10px); }
#mist { width: 100%; height: 100%; display: block; }

#moon {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 30px;
  background: none;
  border: 0;
  cursor: pointer;
  color: var(--pearl);
  font: inherit;
  padding-left:  max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  transition: opacity 1.2s ease;
}
#moon.gone { opacity: 0; pointer-events: none; }

.orb {
  width: 112px; height: 112px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 38% 34%, #ffffff 0%, #f1ebe2 30%, #cfcad6 62%, #9b98ad 100%);
  box-shadow:
    0 0 30px 6px rgba(239, 233, 223, 0.35),
    0 0 90px 30px rgba(184, 188, 203, 0.18),
    0 0 180px 80px rgba(214, 174, 178, 0.08);
  animation: pulse 4.5s ease-in-out infinite;
  transition: transform 1.6s cubic-bezier(0.5, 0, 0.2, 1), opacity 1.6s ease;
}
#moon.gone .orb { transform: scale(7); opacity: 0; }
#moon:focus-visible .orb { outline: 1px solid var(--rose); outline-offset: 14px; }

.moon-words { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.moon-for {
  font-family: var(--display);
  font-style: italic;
  font-size: 1.1rem;
  color: var(--silver);
}
.moon-hint {
  font-size: 0.68rem;
  letter-spacing: 0.5em;
  padding-left: 0.5em;
  text-transform: uppercase;
  color: var(--dim);
  animation: breathe 2.8s ease-in-out infinite;
}

/* ─── Invitation ─────────────────────────────────────────────────── */
#invite { position: relative; z-index: 1; }

.page {
  max-width: 470px;
  margin: 0 auto;
  padding-block: 48px 64px;
  padding-left:  max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* The silver arch */
.arch {
  position: relative;
  border: 1px solid var(--hair);
  border-radius: 999px 999px 4px 4px;
  padding: 92px 26px 46px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  background:
    radial-gradient(80% 40% at 50% 0%, rgba(255, 230, 225, 0.09), transparent 70%),
    linear-gradient(180deg, rgba(70, 14, 28, 0.55), rgba(40, 8, 16, 0.4));
  box-shadow: 0 30px 80px -30px rgba(15, 0, 5, 0.7);
  -webkit-backdrop-filter: blur(3px);
  backdrop-filter: blur(3px);
}
.arch::before {
  content: "";
  position: absolute;
  inset: 9px;
  border: 1px solid rgba(184, 188, 203, 0.12);
  border-radius: 999px 999px 2px 2px;
  pointer-events: none;
}
/* keystone star */
.keystone {
  position: absolute;
  top: -9px;
  left: 50%;
  transform: translateX(-50%);
  width: 18px; height: 18px;
  color: var(--pearl);
  filter: drop-shadow(0 0 8px rgba(239, 233, 223, 0.8));
}

.rise { opacity: 1; }
.pending .rise { opacity: 0; }
.revealing .rise {
  animation: rise 1.8s cubic-bezier(0.2, 0.7, 0.2, 1) both;
  animation-delay: calc(1.4s + var(--i, 0) * 0.24s);
}

.crescent {
  width: 34px; height: 34px;
  color: var(--rose);
  margin-bottom: 22px;
}

.eyebrow {
  font-size: 0.7rem;
  letter-spacing: 0.5em;
  padding-left: 0.5em;
  text-transform: uppercase;
  color: var(--dim);
}

.hero {
  font-family: var(--script);
  font-weight: 400;
  font-size: clamp(4.6rem, 22vw, 6.8rem);
  line-height: 1;
  margin-top: 18px;
  padding: 0.12em 0.25em 0.05em;
  background: linear-gradient(105deg,
    #cdbcbc 0%, #f4ebe8 25%, #ffffff 35%, #e3d3cf 48%,
    #b8a3a3 62%, #f4ebe8 80%, #cdbcbc 100%);
  background-size: 260% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: sheen 10s ease-in-out infinite;
  filter: drop-shadow(0 0 22px rgba(239, 233, 223, 0.18));
}

.name {
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(2.1rem, 9.5vw, 2.9rem);
  letter-spacing: 0.3em;
  padding-left: 0.3em;
  text-transform: uppercase;
  color: var(--pearl);
  margin-top: 2px;
}

.era {
  font-family: var(--display);
  font-style: italic;
  font-size: 1.05rem;
  color: var(--rose);
  margin-top: 14px;
}

.stars-rule {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  max-width: 240px;
  margin-block: 34px;
  color: var(--silver);
}
.stars-rule::before, .stars-rule::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--hair));
}
.stars-rule::after { background: linear-gradient(270deg, transparent, var(--hair)); }
.stars-rule svg { width: 10px; height: 10px; }

.body-text {
  font-size: clamp(1.15rem, 4.3vw, 1.32rem);
  font-weight: 300;
  line-height: 1.7;
  max-width: 28ch;
  text-wrap: balance;
  color: var(--pearl);
}

.details {
  margin-top: 40px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 22px;
}
.row {
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
}
.label {
  font-size: 0.62rem;
  letter-spacing: 0.44em;
  padding-left: 0.44em;
  text-transform: uppercase;
  color: var(--dim);
}
.value {
  font-family: var(--display);
  font-size: 1.32rem;
  color: var(--pearl);
  letter-spacing: 0.02em;
}
.value em { font-style: italic; color: var(--silver); }

.surprise {
  margin-top: 44px;
  padding-top: 30px;
  border-top: 1px solid var(--hair);
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.hush {
  font-family: var(--script);
  font-size: 2.9rem;
  line-height: 1.1;
  color: var(--rose);
  text-shadow: 0 0 18px rgba(214, 174, 178, 0.35);
}
.note {
  font-size: 0.68rem;
  letter-spacing: 0.4em;
  padding-left: 0.4em;
  text-transform: uppercase;
  color: var(--dim);
}

.signoff {
  margin-top: 30px;
  font-family: var(--display);
  font-style: italic;
  font-size: 1rem;
  color: var(--silver);
}

/* ─── Keyframes ──────────────────────────────────────────────────── */
@keyframes rise {
  from { opacity: 0; transform: translateY(16px); filter: blur(8px); }
  to   { opacity: 1; transform: none; filter: blur(0); }
}
@keyframes sheen {
  0%, 100% { background-position: 100% 50%; }
  50%      { background-position: 0% 50%; }
}
@keyframes pulse {
  0%, 100% { transform: scale(1);    box-shadow: 0 0 30px 6px rgba(239,233,223,0.35), 0 0 90px 30px rgba(184,188,203,0.18), 0 0 180px 80px rgba(214,174,178,0.08); }
  50%      { transform: scale(1.04); box-shadow: 0 0 40px 10px rgba(239,233,223,0.45), 0 0 110px 40px rgba(184,188,203,0.22), 0 0 200px 90px rgba(214,174,178,0.12); }
}
@keyframes breathe {
  0%, 100% { opacity: 0.4; }
  50%      { opacity: 1; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    animation-delay: 0ms !important;
    transition-duration: 0.01ms !important;
    transition-delay: 0ms !important;
  }
}
</style>

<canvas id="sky" aria-hidden="true"></canvas>

<div id="mist-wrap" aria-hidden="true"><canvas id="mist"></canvas></div>

<button id="moon" type="button" aria-label="Open Maryam's invitation">
  <span class="orb" aria-hidden="true"></span>
  <span class="moon-words">
    <span class="moon-for">an evening for Maryam</span>
    <span class="moon-hint">Touch the moon</span>
  </span>
</button>

<main id="invite" class="pending">
  <div class="page">
    <div class="arch">
      <svg class="keystone" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 0 C13 9 15 11 24 12 C15 13 13 15 12 24 C11 15 9 13 0 12 C9 11 11 9 12 0 Z" fill="currentColor"/>
      </svg>

      <svg class="crescent rise" style="--i:0" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M26 4 A16 16 0 1 0 36 28 A13 13 0 1 1 26 4 Z" fill="none" stroke="currentColor" stroke-width="1"/>
      </svg>

      <p class="eyebrow rise" style="--i:1">You are invited</p>
      <h2 class="hero rise" style="--i:2">Twenty Fine</h2>
      <h1 class="name rise" style="--i:3">Maryam</h1>
      <p class="era rise" style="--i:4">a new era begins</p>

      <div class="stars-rule rise" style="--i:5" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 0 C13 9 15 11 24 12 C15 13 13 15 12 24 C11 15 9 13 0 12 C9 11 11 9 12 0 Z" fill="currentColor"/></svg>
      </div>

      <p class="body-text rise" style="--i:6">
        Join us for an intimate evening to celebrate the beginning of a beautiful new chapter
      </p>

      <div class="details rise" style="--i:7">
        <div class="row">
          <span class="label">Date</span>
          <span class="value">Saturday, <em>the 24th of</em> October</span>
        </div>
        <div class="row">
          <span class="label">Time</span>
          <span class="value">4:00 <em>until</em> 7:00 pm</span>
        </div>
        <div class="row">
          <span class="label">Venue</span>
          <span class="value">The Artistry Club</span>
        </div>
      </div>

      <div class="surprise rise" style="--i:8">
        <span class="hush">Shhh…</span>
        <span class="note">it's a surprise</span>
      </div>

      <p class="signoff rise" style="--i:9">with love</p>
    </div>
  </div>
</main>

<script>
(() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const moon = document.getElementById('moon');
  const mistWrap = document.getElementById('mist-wrap');
  const invite = document.getElementById('invite');
  let opened = false;

  function open() {
    if (opened) return;
    opened = true;
    moon.classList.add('gone');
    mistWrap.classList.add('lift');
    invite.classList.remove('pending');
    invite.classList.add('revealing');
    shower();
    setTimeout(() => { moon.hidden = true; mistWrap.hidden = true; mistRunning = false; }, 3600);
  }
  moon.addEventListener('click', open);
  setTimeout(open, 7000); // never leave the invite hidden

  /* ─── Sky: twinkling stars, silver dust, shooting stars ─── */
  const sky = document.getElementById('sky');
  const sc = sky.getContext('2d');
  let W, H, stars = [], dust = [], shooters = [];

  function size(c, ctx) {
    const d = Math.min(devicePixelRatio || 1, 2);
    c.width = c.clientWidth * d; c.height = c.clientHeight * d;
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }

  function seedSky() {
    W = sky.clientWidth; H = sky.clientHeight;
    const n = Math.round(Math.min(220, (W * H) / 3500));
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() < 0.08 ? 1.3 + Math.random() : 0.3 + Math.random() * 0.8,
      p: Math.random() * Math.PI * 2, s: 0.008 + Math.random() * 0.025,
      warm: Math.random() < 0.15
    }));
    dust = Array.from({ length: Math.round(n / 4) }, () => newDust(false));
  }

  function newDust(burst) {
    return {
      x: burst ? W / 2 + (Math.random() - 0.5) * 30 : Math.random() * W,
      y: burst ? H * 0.42 + (Math.random() - 0.5) * 30 : Math.random() * H,
      vx: burst ? (Math.random() - 0.5) * 3 : (Math.random() - 0.5) * 0.1,
      vy: burst ? (Math.random() - 0.5) * 3 : 0.05 + Math.random() * 0.15,
      r: 0.6 + Math.random() * 1.6,
      a: 0.3 + Math.random() * 0.5,
      life: burst ? 1 : null
    };
  }

  function shower() {
    if (reduce) return;
    for (let i = 0; i < 90; i++) dust.push(newDust(true));
  }

  function drawSky(t) {
    sc.clearRect(0, 0, W, H);
    for (const s of stars) {
      s.p += s.s;
      const a = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(s.p));
      sc.fillStyle = s.warm ? `rgba(255,214,206,${a})` : `rgba(255,244,238,${a})`;
      sc.beginPath(); sc.arc(s.x, s.y, s.r, 0, Math.PI * 2); sc.fill();
      if (s.r > 1.3) {
        sc.fillStyle = `rgba(236,234,244,${a * 0.15})`;
        sc.beginPath(); sc.arc(s.x, s.y, s.r * 4, 0, Math.PI * 2); sc.fill();
      }
    }
    for (let i = dust.length - 1; i >= 0; i--) {
      const d = dust[i];
      d.x += d.vx; d.y += d.vy;
      if (d.life !== null) {
        d.vx *= 0.98; d.vy = d.vy * 0.98 + 0.01; d.life -= 0.005;
        if (d.life <= 0) { dust.splice(i, 1); continue; }
      } else if (d.y > H + 10) { d.y = -10; d.x = Math.random() * W; }
      const a = d.a * (d.life ?? 1);
      const g = sc.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.r * 3);
      g.addColorStop(0, `rgba(239,233,223,${a})`);
      g.addColorStop(1, 'rgba(239,233,223,0)');
      sc.fillStyle = g;
      sc.beginPath(); sc.arc(d.x, d.y, d.r * 3, 0, Math.PI * 2); sc.fill();
    }
    if (!reduce && Math.random() < 0.004 && shooters.length < 1) {
      shooters.push({ x: Math.random() * W * 0.8, y: Math.random() * H * 0.35, l: 0 });
    }
    for (let i = shooters.length - 1; i >= 0; i--) {
      const s = shooters[i];
      s.l += 0.018;
      const len = 120, dx = 6, dy = 2.4;
      s.x += dx; s.y += dy;
      const a = Math.sin(Math.min(s.l, 1) * Math.PI);
      const g = sc.createLinearGradient(s.x, s.y, s.x - len, s.y - len * 0.4);
      g.addColorStop(0, `rgba(255,255,255,${a})`);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      sc.strokeStyle = g; sc.lineWidth = 1.2;
      sc.beginPath(); sc.moveTo(s.x, s.y); sc.lineTo(s.x - len, s.y - len * 0.4); sc.stroke();
      if (s.l >= 1) shooters.splice(i, 1);
    }
    if (!reduce) requestAnimationFrame(drawSky);
  }

  /* ─── Mist: slow drifting veils of fog over the sky ─── */
  const mist = document.getElementById('mist');
  const mc = mist.getContext('2d');
  let clouds = [], mistRunning = true;

  function seedMist() {
    const w = mist.clientWidth, h = mist.clientHeight;
    clouds = Array.from({ length: 14 }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: Math.max(w, h) * (0.25 + Math.random() * 0.35),
      vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.12,
      tint: Math.random() < 0.4 ? '240,190,190' : '246,226,220',
      a: 0.08 + Math.random() * 0.1
    }));
  }

  function drawMist() {
    const w = mist.clientWidth, h = mist.clientHeight;
    mc.clearRect(0, 0, w, h);
    mc.fillStyle = 'rgba(45,8,18,0.55)';
    mc.fillRect(0, 0, w, h);
    for (const c of clouds) {
      c.x += c.vx; c.y += c.vy;
      if (c.x < -c.r) c.x = w + c.r; if (c.x > w + c.r) c.x = -c.r;
      if (c.y < -c.r) c.y = h + c.r; if (c.y > h + c.r) c.y = -c.r;
      const g = mc.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r);
      g.addColorStop(0, `rgba(${c.tint},${c.a})`);
      g.addColorStop(1, `rgba(${c.tint},0)`);
      mc.fillStyle = g;
      mc.beginPath(); mc.arc(c.x, c.y, c.r, 0, Math.PI * 2); mc.fill();
    }
    if (mistRunning && !reduce) requestAnimationFrame(drawMist);
  }

  function resizeAll() {
    size(sky, sc); size(mist, mc);
    seedSky(); seedMist();
    if (reduce) { drawSky(); drawMist(); }
  }

  resizeAll();
  drawSky(); drawMist();
  addEventListener('resize', resizeAll);
})();
</script>

</body></html>
